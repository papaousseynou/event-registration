<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="container">
        <div class="form-card login-card">
            <header>
                <h1>Connexion</h1>
                <p>Connectez-vous pour accéder à l'application.</p>
            </header>

            <div th:if="${param.error}" class="message error">
                Identifiants incorrects. Veuillez réessayer.
            </div>
            <div th:if="${param.logout}" class="message success">
                Vous avez été déconnecté avec succès.
            </div>

            <form method="post" th:action="@{/login}" class="login-form">
                <div class="form-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </form>

            <div class="login-hint">
                <p><strong>Comptes de démonstration :</strong></p>
                <ul>
                    <li>Admin : <code>admin</code> / <code>admin123</code></li>
                    <li>Utilisateur : <code>user</code> / <code>user123</code></li>
                </ul>
            </div>
        </div>
    </main>
</body>
</html>
