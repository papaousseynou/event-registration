<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des inscriptions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main class="container container-wide">
        <header>
            <h1>Liste des inscriptions</h1>
            <p th:text="${#lists.size(inscriptions)} + ' personne(s) inscrite(s)'">0 personne(s) inscrite(s)</p>
        </header>

        <div class="actions filter-bar">
            <a href="/" class="btn btn-primary">Nouvelle inscription</a>

            <form method="get" action="/liste" class="filter-form">
                <label for="evenementId">Filtrer par événement</label>
                <select id="evenementId" name="evenementId" onchange="this.form.submit()">
                    <option value="">Tous les événements</option>
                    <option th:each="evenement : ${evenements}"
                            th:value="${evenement.id}"
                            th:text="${evenement.nom}"
                            th:selected="${evenementId != null and evenementId == evenement.id}">
                        Événement
                    </option>
                </select>
            </form>
        </div>

        <div th:if="${#lists.isEmpty(inscriptions)}" class="empty-state">
            <p th:if="${evenementId == null}">Aucune inscription pour le moment.</p>
            <p th:unless="${evenementId == null}">Aucune inscription pour cet événement.</p>
        </div>

        <table th:unless="${#lists.isEmpty(inscriptions)}" class="table">
            <thead>
                <tr>
                    <th>Événement</th>
                    <th>Prénom</th>
                    <th>Nom</th>
                    <th>Téléphone</th>
                    <th>Date de naissance</th>
                    <th>Sexe</th>
                    <th>Date d'inscription</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="inscription : ${inscriptions}">
                    <td th:text="${inscription.evenementNom}">Événement</td>
                    <td th:text="${inscription.prenom}">Prénom</td>
                    <td th:text="${inscription.nom}">Nom</td>
                    <td th:text="${inscription.telephone}">Téléphone</td>
                    <td th:text="${#temporals.format(inscription.dateNaissance, 'dd/MM/yyyy')}">01/01/1990</td>
                    <td th:text="${inscription.sexe}">Sexe</td>
                    <td th:text="${#temporals.format(inscription.dateInscription, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                </tr>
            </tbody>
        </table>
    </main>
</body>
</html>
